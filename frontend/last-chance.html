"#23 Mixed 55+ 200 Medley Relay","2:14.81","5/19/2018 Garden State Masters GSM-7 J.Zakim,L.Ditommaso, F.McElroy, D.Cipriano"
`;

        const container = document.getElementById('records-container');
        const ageFilter = document.getElementById('filter-age');
        const eventFilter = document.getElementById('filter-event');
        const genderFilter = document.getElementById('filter-gender');
        const nameFilter = document.getElementById('filter-name');
        const clearBtn = document.getElementById('clear-filters');

        let records = [];
        let groupedRecords = {};

        // Helper to format times
        function parseTime(timeStr) {
            if (!timeStr) return "NT";
            let clean = timeStr.replace(/[\s:]+$/, '').trim();
            if (/^\d{3,}\.\d{2}$/.test(clean)) {
                const parts = clean.split('.');
                clean = `${parts[0].slice(0, -2)}:${parts[0].slice(-2)}.${parts[1]}`;
            }
            if (clean.startsWith(':')) {
                clean = clean.substring(1);
                 if (/^\d{3,}\.\d{2}$/.test(clean)) {
                    const parts = clean.split('.');
                    clean = `${parts[0].slice(0, -2)}:${parts[0].slice(-2)}.${parts[1]}`;
                 }
            }
             clean = clean.replace(/\s*:$/, '');
            return clean;
        }

        // --- INTELLIGENT PARSING ---
        function parseData() {
            try {
                const cleanData = rawData
                    .replace(/[\u2018\u2019]/g, "'")
                    .replace(/[\u201C\u201D]/g, '"');

                const lines = cleanData.split('\n').filter(line => line.trim().startsWith('"#'));
                
                // Backup list of multi-word teams if no separator is found
                const knownTeams = [
                    "Somerset County", 
                    "Peddie Aquatic A", 
                    "Jersey Aquatic C", 
                    "Landshark Aquati", 
                    "Landshark Aquatic Masters", 
                    "Montgomery Ancie", 
                    "Pineapples", 
                    "Chelsea Piers Fitness", 
                    "ECU Club Swimmin", 
                    "Garden State Mas", 
                    "Valley Health Li", 
                    "AGUA Masters", 
                    "Yonkers Masters", 
                    "Connecticut Mast",
                    "West Morris Area",
                    "Red Tide",
                    "Raritan Bay Masters"
                ];

                container.innerHTML = `<div class="text-center text-slate-500 py-4">Found ${lines.length} raw records. Processing...</div>`;

                lines.forEach(line => {
                    const parts = line.match(/"([^"]+)"/g);
                    if (!parts || parts.length < 3) return;

                    const eventPart = parts[0].replace(/"/g, '').trim();
                    const timePart = parts[1].replace(/"/g, '').trim();
                    const infoPart = parts[2].replace(/"/g, '').trim();

                    // Parse Event Header
                    const eventMatch = eventPart.match(/#\d+\s+(Women|Men|Mixed)\s+(\d+-\d+)\s+(.+)/);
                    if (!eventMatch && eventPart.includes("Relay")) {
                        var relayMatch = eventPart.match(/#\d+\s+(Women|Men|Mixed)\s+(\d+\+?|\d+-\d+)\s+(.+)/);
                         if (relayMatch) {
                            var gender = relayMatch[1];
                            var ageGroup = relayMatch[2];
                            var eventName = relayMatch[3];
                            if (ageGroup.includes('+')) ageGroup = ageGroup.replace('+', '-99');
                         }
                         else return;
                    } else if (eventMatch) {
                        var gender = eventMatch[1];
                        var ageGroup = eventMatch[2];
                        var eventName = eventMatch[3];
                    } else return;

                    const time = parseTime(timePart);

                    // Parse Date and Name/Club
                    const dateMatch = infoPart.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
                    let date = "";
                    let swimmerInfo = infoPart;

                    if (dateMatch) {
                        date = dateMatch[0];
                        swimmerInfo = infoPart.replace(date, '').trim();
                        swimmerInfo = swimmerInfo.replace(/^[- ]+|[- ]+$/g, '');
                    }

                    let name = swimmerInfo;
                    let club = "";
                    
                    // --- PARSING LOGIC ---
                    
                    // 1. Relays: Name field contains everything (Teams + Swimmers)
                    if (eventName.includes('Relay')) {
                         name = swimmerInfo;
                         club = ""; 
                    } 
                    // 2. Look for " - " (Space Hyphen Space) separator
                    else if (swimmerInfo.includes(' - ')) {
                        const splitInfo = swimmerInfo.split(' - ');
                        // Everything after the last " - " is the Club
                        club = splitInfo[splitInfo.length - 1].trim();
                        // Everything before is the Name
                        name = splitInfo.slice(0, -1).join(' - ').trim();
                    } 
                    // 3. No separator? Check known multi-word teams
                    else {
                         let foundTeam = false;
                         for (const team of knownTeams) {
                             if (swimmerInfo.endsWith(team)) {
                                 club = team;
                                 name = swimmerInfo.replace(team, '').trim();
                                 foundTeam = true;
                                 break;
                             }
                         }
                         // 4. Fallback: Take last word (e.g. for "MPNY-6")
                         if (!foundTeam) {
                             const words = swimmerInfo.split(' ');
                             if (words.length > 1) {
                                 club = words.pop();
                                 name = words.join(' ');
                             } else {
                                 name = swimmerInfo;
                             }
                         }
                    }

                    records.push({ ageGroup, gender, eventName, time, date, name, club });
                });
            } catch (err) {
                container.innerHTML = `<div class="text-center text-red-500 font-bold py-12">Error parsing data: ${err.message}</div>`;
                console.error(err);
            }
        }

        function groupRecords(data) {
            const groups = {};
            data.forEach(rec => {
                if (!groups[rec.ageGroup]) groups[rec.ageGroup] = {};
                if (!groups[rec.ageGroup][rec.eventName]) groups[rec.ageGroup][rec.eventName] = { women: null, men: null, mixed: null };
                if (rec.gender === 'Women') groups[rec.ageGroup][rec.eventName].women = rec;
                else if (rec.gender === 'Men') groups[rec.ageGroup][rec.eventName].men = rec;
                else groups[rec.ageGroup][rec.eventName].mixed = rec;
            });
            return groups;
        }

        function renderTable() {
            try {
                container.innerHTML = '';
                
                const selectedAge = ageFilter.value;
                const selectedEvent = eventFilter.value;
                const selectedGender = genderFilter.value;
                const searchName = nameFilter.value.toLowerCase();

                const filteredRecords = records.filter(rec => {
                    const matchAge = selectedAge === 'all' || rec.ageGroup === selectedAge;
                    const matchEvent = selectedEvent === 'all' || rec.eventName === selectedEvent;
                    const matchGender = selectedGender === 'all' || rec.gender === selectedGender;
                    const matchName = !searchName || rec.name.toLowerCase().includes(searchName);
                    return matchAge && matchEvent && matchGender && matchName;
                });

                // Split records into INDIVIDUAL vs RELAY
                const indRecords = filteredRecords.filter(r => !r.eventName.toLowerCase().includes('relay'));
                const relRecords = filteredRecords.filter(r => r.eventName.toLowerCase().includes('relay'));

                // Render Individual Events First
                if (indRecords.length > 0) {
                    renderGroupSet(indRecords);
                }

                // Render Relays at the Bottom
                if (relRecords.length > 0) {
                    // Add a visual separator
                    const sep = document.createElement('div');
                    sep.className = "mt-12 mb-6 pt-8 border-t-4 border-slate-200 text-center";
                    sep.innerHTML = '<h2 class="text-3xl font-bold text-slate-700 uppercase tracking-widest">Relay Results</h2>';
                    container.appendChild(sep);
                    
                    renderGroupSet(relRecords);
                }
                
                if (indRecords.length === 0 && relRecords.length === 0) {
                     container.innerHTML = '<div class="text-center text-slate-500 py-8">No records found matching your filters.</div>';
                }

            } catch (err) {
                 container.innerHTML += `<div class="text-center text-red-500 font-bold py-4">Error rendering table: ${err.message}</div>`;
                 console.error(err);
            }
        }

        // Helper function to render a set of records (e.g. just Individuals or just Relays)
        function renderGroupSet(dataSubset) {
            const grouped = groupRecords(dataSubset);
            const sortedAgeGroups = Object.keys(grouped).sort((a, b) => parseInt(a) - parseInt(b));

            const strokeOrder = { 'Fly': 4, 'Back': 2, 'Breast': 3, 'Free': 1, 'IM': 5 };
            function getEventRank(eventName) {
                if (eventName.includes('Relay')) return 90000 + (eventName.includes('Medley') ? 2 : 1); 
                const parts = eventName.split(' ');
                const distance = parseInt(parts[0]) || 0;
                const stroke = parts.slice(1).join(' '); 
                const sRank = strokeOrder[stroke] || 99; 
                return (sRank * 10000) + distance;
            }

            sortedAgeGroups.forEach(age => {
                const eventsObj = grouped[age];
                const eventNames = Object.keys(eventsObj).sort((a, b) => getEventRank(a) - getEventRank(b));

                const section = document.createElement('div');
                section.className = 'bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mb-8'; 
                
                const header = document.createElement('div');
                header.className = 'bg-slate-100 px-4 py-4 border-b border-slate-200';
                header.innerHTML = `<h2 class="text-xl font-bold text-slate-800">Age Group: <span class="text-sky-600">${age}</span></h2>`;
                section.appendChild(header);

                const tableContainer = document.createElement('div');
                tableContainer.className = 'overflow-x-auto table-container';
                
                const table = document.createElement('table');
                table.className = 'min-w-full text-left text-sm whitespace-nowrap';
                
                table.innerHTML = `
                    <thead class="table-header border-b border-slate-200">
                        <tr class="hidden md:table-row bg-slate-50 border-b border-slate-200">
                            <th colspan="3" class="py-2 text-center text-sky-800 font-bold tracking-widest text-xs uppercase border-r border-slate-200">Women</th>
                            <th class="bg-slate-200 border-x border-slate-300"></th> 
                            <th colspan="3" class="py-2 text-center text-sky-800 font-bold tracking-widest text-xs uppercase border-l border-slate-200">Men / Mixed</th>
                        </tr>
                        <tr>
                            <th scope="col" class="px-2 py-3 text-right hidden md:table-cell w-1/12 text-slate-500">Date</th>
                            <th scope="col" class="px-2 py-3 text-right hidden sm:table-cell w-2/12 text-slate-500">Name</th>
                            <th scope="col" class="px-2 py-3 text-right w-1/12 font-bold text-slate-600">Time</th>
                            <th scope="col" class="px-4 py-3 text-center bg-slate-200 font-bold text-slate-800 w-2/12 border-x border-slate-300">Event</th>
                            <th scope="col" class="px-2 py-3 text-left w-1/12 font-bold text-slate-600">Time</th>
                            <th scope="col" class="px-2 py-3 text-left hidden sm:table-cell w-2/12 text-slate-500">Name</th>
                            <th scope="col" class="px-2 py-3 text-left hidden md:table-cell w-1/12 text-slate-500">Date</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100"></tbody>
                `;

                const tbody = table.querySelector('tbody');

                eventNames.forEach(evt => {
                    const rowData = eventsObj[evt];
                    const w = rowData.women;
                    const m = rowData.men;
                    const x = rowData.mixed;

                    if (w || m) {
                        const tr = document.createElement('tr');
                        tr.className = 'record-row hover:bg-slate-50 transition-colors align-top';
                        
                        const wDate = w ? w.date : '';
                        const wTime = w ? `<span class="font-mono font-semibold text-sky-600 text-lg md:text-base">${w.time}</span>` : '<span class="text-slate-300">-</span>';
                        const wMobileInfo = w ? `<div class="md:hidden mb-1 mobile-wrap"><div class="text-xs font-bold text-slate-700 leading-tight">${w.name}</div><div class="text-xs text-slate-500">${w.club} • ${w.date}</div></div>` : '';
                        const wFullDetails = w ? `<div class="font-medium text-slate-700">${w.name}</div><div class="text-xs text-slate-500">${w.club}</div>` : '';

                        const mDate = m ? m.date : '';
                        const mTime = m ? `<span class="font-mono font-semibold text-sky-600 text-lg md:text-base">${m.time}</span>` : '<span class="text-slate-300">-</span>';
                        const mMobileInfo = m ? `<div class="md:hidden mb-1 mobile-wrap text-right"><div class="text-xs font-bold text-slate-700 leading-tight">${m.name}</div><div class="text-xs text-slate-500">${m.club} • ${m.date}</div></div>` : '';
                        const mFullDetails = m ? `<div class="font-medium text-slate-700">${m.name}</div><div class="text-xs text-slate-500">${m.club}</div>` : '';
                        
                        tr.innerHTML = `
                            <td class="px-2 py-3 text-right text-slate-500 hidden md:table-cell text-xs">${wDate}</td>
                            <td class="px-2 py-3 text-right hidden sm:table-cell">${wFullDetails}</td>
                            <td class="px-2 py-3 text-right">${wMobileInfo}${wTime}</td>
                            <td class="px-2 py-3 text-center font-bold text-slate-800 bg-slate-50 border-x border-slate-100 text-sm align-middle">${evt}</td>
                            <td class="px-2 py-3 text-left">${mMobileInfo}${mTime}</td>
                            <td class="px-2 py-3 text-left hidden sm:table-cell">${mFullDetails}</td>
                            <td class="px-2 py-3 text-left text-slate-500 hidden md:table-cell text-xs">${mDate}</td>
                        `;
                        tbody.appendChild(tr);
                    }

                    if (x) {
                        const tr = document.createElement('tr');
                        tr.className = 'record-row bg-slate-50';
                        
                        const xMobileInfo = `<div class="md:hidden mb-1 mobile-wrap text-left"><div class="text-xs font-bold text-slate-700 leading-tight">${x.name}</div><div class="text-xs text-slate-500">${x.club} • ${x.date}</div></div>`;
                        const xFullDetails = `<div class="font-medium text-slate-700">${x.name}</div><div class="text-xs text-slate-500">${x.club}</div>`;

                        tr.innerHTML = `
                            <td colspan="3" class="px-2 py-3 text-right italic text-slate-500 text-xs md:text-sm">Mixed Record</td>
                            <td class="px-2 py-3 text-center font-bold text-slate-800 bg-slate-100 border-x border-slate-200 text-sm align-middle">${evt}</td>
                            <td class="px-2 py-3 text-left">
                                ${xMobileInfo}
                                <span class="font-mono font-semibold text-purple-600 text-lg md:text-base">${x.time}</span>
                            </td>
                            <td class="px-2 py-3 text-left hidden sm:table-cell">${xFullDetails}</td>
                            <td class="px-2 py-3 text-left text-slate-500 hidden md:table-cell text-xs">${x.date}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

                tableContainer.appendChild(table);
                section.appendChild(tableContainer);
                container.appendChild(section);
            });
        }

        function populateFilters() {
            try {
                const ageGroups = [...new Set(records.map(r => r.ageGroup))].sort((a,b) => parseInt(a) - parseInt(b));
                const events = [...new Set(records.map(r => r.eventName))].sort();

                ageGroups.forEach(age => {
                    const opt = document.createElement('option');
                    opt.value = age;
                    opt.textContent = age;
                    ageFilter.appendChild(opt);
                });

                events.forEach(evt => {
                    const opt = document.createElement('option');
                    opt.value = evt;
                    opt.textContent = evt;
                    eventFilter.appendChild(opt);
                });
            } catch(e) { console.error("Filter error", e); }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            parseData();
            populateFilters();
            renderTable();
        });

        // --- Event Listeners ---
        ageFilter.addEventListener('change', renderTable);
        eventFilter.addEventListener('change', renderTable);
        genderFilter.addEventListener('change', renderTable);
        nameFilter.addEventListener('input', renderTable);
        clearBtn.addEventListener('click', () => {
            ageFilter.value = 'all';
            eventFilter.value = 'all';
            genderFilter.value = 'all';
            nameFilter.value = '';
            renderTable();
        });

    </script>
