# y-swim.com web server config (nginx inside the Cloud Run container).
# Serves the static files in frontend/ exactly as they are: no build step, no rewriting.

# www.y-swim.com -> https://y-swim.com (keeps the path), so both addresses work
# and search engines see one site.
server {
    listen 8080;
    server_name www.y-swim.com;
    return 301 https://y-swim.com$request_uri;
}

# Everything else: y-swim.com, the *.run.app address, health checks.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Pages, script and styles: browsers re-check on every visit (cheap 304s via ETag),
    # so a fix pushed to main shows up immediately.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Images: cache for a day.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never serve hidden files.
    location ~ /\. {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
